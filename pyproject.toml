[project]
name = "pyairsend"
version = "0.1.0"
description = "Exchange information with nearby devices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["pyairsend"]
